[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
# Hard per-test cap. `thread` method works cross-platform and interrupts a hung
# await; a genuinely slow test can override with @pytest.mark.timeout(N).
timeout = 120
timeout_method = thread
